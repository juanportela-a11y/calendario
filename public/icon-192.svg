<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072B61" />
      <stop offset="50%" stop-color="#0D47A1" />
      <stop offset="100%" stop-color="#1976D2" />
    </linearGradient>
    <linearGradient id="goldGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="riverGrad192" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="shadow192" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#021430" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)" />
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="url(#goldGrad192)" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Sun in center top -->
  <circle cx="96" cy="40" r="14" fill="#FDE047" opacity="0.9" />
  <circle cx="96" cy="40" r="22" fill="url(#goldGrad192)" opacity="0.25" />

  <!-- Calendar card -->
  <g filter="url(#shadow192)">
    <rect x="42" y="52" width="108" height="92" rx="14" fill="#FFFFFF" />
    <path d="M 42 66 C 42 58.268, 48.268 52, 56 52 L 136 52 C 143.732 52, 150 58.268, 150 66 L 150 78 L 42 78 Z" fill="#DC2626" />
    <rect x="42" y="76" width="108" height="2" fill="url(#goldGrad192)" />
    <rect x="64" y="46" width="6" height="12" rx="3" fill="#D97706" stroke="#FFFFFF" stroke-width="1" />
    <rect x="122" y="46" width="6" height="12" rx="3" fill="#D97706" stroke="#FFFFFF" stroke-width="1" />

    <!-- Palm Frond icon -->
    <path d="M 96 122 Q 96 90 74 80 Q 92 88 96 122 Z" fill="#15803D" />
    <path d="M 96 122 Q 96 90 118 80 Q 100 88 96 122 Z" fill="#16A34A" />
    <path d="M 96 122 Q 96 74 96 68 Q 99 74 96 122 Z" fill="#4ADE80" />

    <!-- Checkmark Pin -->
    <circle cx="72" cy="118" r="9" fill="#0D47A1" />
    <path d="M 68 118 L 71 121 L 76 115" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Red Alert Pin -->
    <circle cx="126" cy="92" r="5.5" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.2" />
  </g>

  <!-- River Wave at bottom -->
  <path d="M 24 160 Q 60 148 96 160 T 168 160 L 168 170 Q 120 176 96 170 T 24 170 Z" fill="url(#riverGrad192)" opacity="0.9" />

  <!-- Municipal Tag -->
  <text x="96" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="7.5" fill="#F8FAFC" letter-spacing="1">PURIFICACIÓN</text>
</svg>
